<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>GameTime — Three screen design board</title><link rel="stylesheet" href="design.css"><style>.capture-board main{max-width:1320px;padding:35px 40px 25px}.capture-board .screen-grid{gap:36px;max-width:none;grid-template-columns:repeat(3,minmax(0,1fr))}.capture-board .phone{height:844px}.capture-board .screen-caption{font-size:11px;margin-bottom:16px}.capture-board .screen-caption span:last-child{display:block}.capture-board .board-foot{display:flex;justify-content:space-between;gap:25px;font-size:10px;color:var(--sub);margin-top:22px}.capture-board .inset{padding-left:22px;padding-right:22px}</style></head><body class="capture-board"><main><div class="screen-grid"><article class="screen-column"><div class="screen-caption"><span>01 / HOME</span><span>The live challenge</span></div><div class="phone" data-phone="home" data-initial="home" aria-label="Home mockup"></div></article><article class="screen-column"><div class="screen-caption"><span>02 / GOAL & RULES</span><span>The agreement, understood</span></div><div class="phone" data-phone="goal" data-initial="goal" aria-label="Goal and rules mockup"></div></article><article class="screen-column"><div class="screen-caption"><span>03 / YOU</span><span>A record worth keeping</span></div><div class="phone" data-phone="you" data-initial="you" aria-label="Personal record mockup"></div></article></div><div class="board-foot"><span>GameTime · One system · Light athletic</span><span>Design proposal · Fictional people and activity · September 2026</span></div></main><script src="prototype.js"></script></body></html>
