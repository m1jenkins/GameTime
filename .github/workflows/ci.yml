name: CI

on:
  # Feature branches are covered by `pull_request`. Listing them under `push`
  # as well runs every suite twice per commit and posts duplicate checks.
  # `push` is kept for main so post-merge state is verified on its own.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt out of Supabase CLI telemetry. Also avoids a false failure: an
  # unreachable PostHog endpoint makes the CLI exit non-zero on shutdown even
  # when every test passed.
  DO_NOT_TRACK: 1

jobs:
  # Schema, constraints, and RLS. The suite that matters most: access rules and
  # ledger invariants are asserted here, against a real Postgres.
  database:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start Supabase
        run: supabase start -x edge-runtime

      - name: Run pgTAP suite
        run: ./scripts/db-test.sh

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # Edge Functions. Tests run under plain Deno rather than the edge-runtime
  # container: handlers are written as exported `(Request) => Response`
  # functions so they can be invoked directly, which is both faster and less
  # environment-dependent.
  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      # Resolves the lockfile as its own step. M3 added npm dependencies, and a
      # resolution failure surfaced from `deno check` reads as a type error,
      # which sends the next person looking in the wrong place.
      - name: Install dependencies
        run: deno install

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check .

      - name: Test
        run: deno test --allow-env

  # Portable client logic. GameTimeCore imports no Apple frameworks, so it
  # builds and tests on a Linux runner.
  client-core:
    name: Client Core (Swift Testing)
    runs-on: ubuntu-latest
    container: swift:6.3
    defaults:
      run:
        working-directory: ios/GameTimeCore
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # Apple-framework integration and the exact production request envelopes.
  # Pin both the runner generation and Xcode so the simulator gate does not
  # silently change underneath the App Attest conformance target.
  conformance-ios:
    name: Conformance (iOS Simulator)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "26.2"

      - name: Select iOS 26.2 simulator
        id: simulator
        run: |
          simulator_id="$(
            xcrun simctl list devices available -j |
              python3 -c '
          import json
          import sys

          devices = json.load(sys.stdin)["devices"].get(
              "com.apple.CoreSimulator.SimRuntime.iOS-26-2",
              [],
          )
          simulator = next(
              (
                  device
                  for device in devices
                  if device.get("isAvailable")
                  and device.get("name", "").startswith("iPhone ")
              ),
              None,
          )
          if simulator is None:
              raise SystemExit("no available iOS 26.2 iPhone simulator")
          print(simulator["udid"])
          '
          )"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Build without signing
        run: |
          xcodebuild \
            -project ios/GameTimeConformance/GameTimeConformance.xcodeproj \
            -scheme GameTimeConformance \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test
        run: |
          xcodebuild \
            -project ios/GameTimeConformance/GameTimeConformance.xcodeproj \
            -scheme GameTimeConformance \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -resultBundlePath "$RUNNER_TEMP/GameTimeConformance.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-ios-xcresult
          path: ${{ runner.temp }}/GameTimeConformance.xcresult
          if-no-files-found: ignore
