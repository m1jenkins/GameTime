name: CI

on:
  # Feature branches are covered by `pull_request`. Listing them under `push`
  # as well runs every suite twice per commit and posts duplicate checks.
  # `push` is kept for main so post-merge state is verified on its own.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt out of Supabase CLI telemetry. Also avoids a false failure: an
  # unreachable PostHog endpoint makes the CLI exit non-zero on shutdown even
  # when every test passed.
  DO_NOT_TRACK: 1

jobs:
  # Schema, constraints, and RLS. The suite that matters most: access rules and
  # ledger invariants are asserted here, against a real Postgres.
  database:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Start Supabase
        run: supabase start -x edge-runtime

      - name: Run pgTAP suite
        run: ./scripts/db-test.sh

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # Edge Functions. Tests run under plain Deno rather than the edge-runtime
  # container: handlers are written as exported `(Request) => Response`
  # functions so they can be invoked directly, which is both faster and less
  # environment-dependent.
  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      # Resolves the lockfile as its own step. M3 added npm dependencies, and a
      # resolution failure surfaced from `deno check` reads as a type error,
      # which sends the next person looking in the wrong place.
      - name: Install dependencies
        run: deno install

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check .

      - name: Test
        run: deno test --allow-env

  # Portable client logic. GameTimeCore imports no Apple frameworks, so it
  # builds and tests on a Linux runner independently of Xcode.
  client-core:
    name: Client Core (Swift Testing)
    runs-on: ubuntu-latest
    container: swift:6.3
    defaults:
      run:
        working-directory: ios/GameTimeCore
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # Product and conformance targets use the same audited Xcode/iOS toolchain.
  # The runner image retains Xcode 26.2 and its matching iOS 26.2 simulator;
  # selecting it explicitly prevents a default-Xcode image update from
  # silently changing the compiler or SDK.
  ios:
    name: iOS product and conformance (Xcode 26.2)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Select audited Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Resolve pinned product packages
        run: |
          xcodebuild \
            -project ios/GameTime/GameTime.xcodeproj \
            -scheme GameTime \
            -resolvePackageDependencies

      - name: Test product app
        run: |
          xcodebuild \
            -project ios/GameTime/GameTime.xcodeproj \
            -scheme GameTime \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build staging and release products
        run: |
          xcodebuild \
            -project ios/GameTime/GameTime.xcodeproj \
            -scheme GameTime-Staging \
            -configuration Staging \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild \
            -project ios/GameTime/GameTime.xcodeproj \
            -scheme GameTime \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test conformance harness
        run: |
          xcodebuild \
            -project ios/GameTimeConformance/GameTimeConformance.xcodeproj \
            -scheme GameTimeConformance \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            CODE_SIGNING_ALLOWED=NO \
            test
