html &gt; body {

a:is(:hover, :focus-visible) {

h3,
h4,
h5,
h6,

}

h3,

}

b,
strong,
th {

.table-responsive {

  overflow-x: auto;

.table {

  color: var(--foreground);
  font: inherit;

.table :is(th, td) {

  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {

.table :is(caption, thead th) {

.table thead th {

.table .text-nowrap {

.card {

  padding: 12px;

  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);

  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  top: 0;
  left: 0;
  width: max-content;

    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)

  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);

.viz-grid {

  gap: 2px;

}

  height: 1px;
  padding: 0;

.viz-controls {

  mask: var(--checkmark-image) center / 12px 12px no-repeat;

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {

  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;

  height: auto;

          states: [S(&#x27;Demo&#x27;, &#x27;choice&#x27;, &#x27;Persistent top banner; local synthetic data only.&#x27;), S(&#x27;Staging&#x27;, &#x27;choice&#x27;, &#x27;Persistent test-environment disclosure.&#x27;), S(&#x27;Release&#x27;, &#x27;success&#x27;, &#x27;No test banner; configuration gates must still hide or lock unfinished mutations.&#x27;), S(&#x27;Banner plus system sheet&#x27;, &#x27;choice&#x27;, &#x27;Keep trust context readable without overlapping native sheets.&#x27;)]
        },
        {
          id: &#x27;I04&#x27;, group: &#x27;overlay&#x27;, title: &#x27;Unavailable or stale deep link&#x27;, status: &#x27;overlay&#x27;, tab: &#x27;&#x27;,
          purpose: &#x27;Recover safely when a push, inbox item, or saved route no longer authorizes a destination.&#x27;,
          entry: &#x27;Push · inbox · restored navigation path&#x27;, exits: &#x27;Relevant tab root · refresh · Welcome&#x27;, source: &#x27;Existing ContentUnavailableView patterns + future inbox&#x27;,
          sections: [[&#x27;Unavailable&#x27;, [&#x27;Reason safe to disclose&#x27;, &#x27;Last refresh&#x27;, &#x27;Next authorized destination&#x27;]]], actions: [&#x27;Refresh&#x27;, &#x27;Back to tab&#x27;],
          states: [S(&#x27;Contest unavailable&#x27;, &#x27;failure&#x27;, &#x27;Could be deleted from local cache, inaccessible, or not yet refreshed.&#x27;), S(&#x27;Standings unauthorized&#x27;, &#x27;failure&#x27;, &#x27;Require accepted active/final participant state.&#x27;), S(&#x27;Invitation resolved&#x27;, &#x27;empty&#x27;, &#x27;Return to Challenge detail if still visible.&#x27;), S(&#x27;Inbox item resolved&#x27;, &#x27;empty&#x27;, &#x27;Move it to resolved history.&#x27;), S(&#x27;Wrong signed-in account&#x27;, &#x27;failure&#x27;, &#x27;Do not switch accounts implicitly or disclose target details.&#x27;), S(&#x27;Session expired&#x27;, &#x27;failure&#x27;, &#x27;Reset private routes and return to Welcome.&#x27;)]
        }
      ];

      const map = root.querySelector(&#x27;#atlas-map&#x27;);
      const summary = root.querySelector(&#x27;#atlas-summary&#x27;);
      let selectedScreen = screens.find((screen) =&gt; screen.id === &#x27;C06&#x27;);
      let selectedState = selectedScreen.states[0];

      const statusLabel = { built: &#x27;Implemented&#x27;, planned: &#x27;Planned&#x27;, system: &#x27;Apple system&#x27;, overlay: &#x27;Shared overlay&#x27; };
      const kindIcon = { loading: &#x27;loader-circle&#x27;, empty: &#x27;circle-off&#x27;, failure: &#x27;triangle-alert&#x27;, choice: &#x27;split&#x27;, success: &#x27;circle-check&#x27; };

      function renderSummary() {
        const counts = screens.reduce((acc, screen) =&gt; {
          acc[screen.status] = (acc[screen.status] || 0) + 1;
          acc.states += screen.states.length;
          return acc;
        }, { states: 0 });
        const values = [
          [&#x27;Navigation surfaces&#x27;, screens.length],
          [&#x27;Implemented now&#x27;, counts.built || 0],
          [&#x27;Planned client pages&#x27;, counts.planned || 0],
          [&#x27;State variants&#x27;, counts.states]
        ];
        summary.innerHTML = values.map(([label, value]) =&gt; `
          &lt;div class=&quot;card viz-stat&quot;&gt;
            &lt;div class=&quot;text-muted&quot;&gt;${label}&lt;/div&gt;
            &lt;div class=&quot;viz-stat-value&quot;&gt;${value}&lt;/div&gt;
          &lt;/div&gt;`).join(&#x27;&#x27;);
      }

      function renderMap() {
        map.innerHTML = &#x27;&#x27;;
        groups.forEach((group) =&gt; {
          const groupScreens = screens.filter((screen) =&gt; screen.group === group.id);
          const section = document.createElement(&#x27;section&#x27;);
          section.className = &#x27;flow-group&#x27;;
          section.innerHTML = `
            &lt;div class=&quot;flow-heading&quot;&gt;
              &lt;h3&gt;${group.label}&lt;/h3&gt;
              &lt;span class=&quot;text-small text-muted&quot;&gt;${group.hint} · ${groupScreens.length} surfaces&lt;/span&gt;
            &lt;/div&gt;
            &lt;div class=&quot;flow-nodes&quot;&gt;&lt;/div&gt;`;
          const nodes = section.querySelector(&#x27;.flow-nodes&#x27;);
          groupScreens.forEach((screen) =&gt; {
            const node = document.createElement(&#x27;div&#x27;);
            node.className = &#x27;flow-node&#x27;;
            const button = document.createElement(&#x27;button&#x27;);
            button.type = &#x27;button&#x27;;
            button.className = &#x27;btn&#x27;;
            button.dataset.screenId = screen.id;
            button.setAttribute(&#x27;aria-pressed&#x27;, screen.id === selectedScreen.id ? &#x27;true&#x27; : &#x27;false&#x27;);
            button.setAttribute(&#x27;aria-label&#x27;, `${screen.id} ${screen.title}, ${statusLabel[screen.status]}, ${screen.states.length} state variants`);
            button.textContent = screen.id;
            button.addEventListener(&#x27;click&#x27;, () =&gt; {
              selectedScreen = screen;
              selectedState = screen.states[0];
              renderMap();
              renderSelection();
              root.querySelector(&#x27;#screen-title&#x27;).scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;nearest&#x27; });
            });
            node.innerHTML = `&lt;div class=&quot;node-top&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span class=&quot;node-status ${screen.status}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;node-title&quot;&gt;${screen.title}&lt;/span&gt;&lt;span class=&quot;node-states text-small&quot;&gt;${screen.states.length} variants&lt;/span&gt;`;
            node.querySelector(&#x27;.node-top span:first-child&#x27;).replaceWith(button);
            nodes.appendChild(node);
          });
          map.appendChild(section);
        });
      }

      function currentTabMarkup(tab) {
        if (!tab) return &#x27;&#x27;;
        const active = tab.includes(&#x27;/&#x27;) ? tab.split(&#x27;/&#x27;)[0].trim() : tab;
        return `&lt;div class=&quot;wire-tabbar text-small&quot; aria-label=&quot;Tab bar&quot;&gt;
          ${[&#x27;Today&#x27;, &#x27;Challenges&#x27;, &#x27;Friends&#x27;, &#x27;You&#x27;].map((item) =&gt; `&lt;span class=&quot;${item === active ? &#x27;active&#x27; : &#x27;&#x27;}&quot;&gt;${item}&lt;/span&gt;`).join(&#x27;&#x27;)}
        &lt;/div&gt;`;
      }

      function renderWireframe() {
        const sections = selectedScreen.sections.map(([title, rows]) =&gt; `
          &lt;div class=&quot;wire-section&quot;&gt;
            &lt;div class=&quot;wire-section-title text-small&quot;&gt;${title}&lt;/div&gt;
            ${rows.map((row) =&gt; `&lt;div class=&quot;wire-row&quot;&gt;&lt;span&gt;${row}&lt;/span&gt;&lt;i data-lucide=&quot;chevron-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}
          &lt;/div&gt;`).join(&#x27;&#x27;);
        const actions = selectedScreen.actions.length ? `
          &lt;div class=&quot;wire-actions&quot;&gt;
            ${selectedScreen.actions.map((action, index) =&gt; `&lt;button type=&quot;button&quot; class=&quot;btn ${index === 0 ? &#x27;btn-primary&#x27; : &#x27;&#x27;}&quot; disabled&gt;${action}&lt;/button&gt;`).join(&#x27;&#x27;)}
          &lt;/div&gt;` : &#x27;&#x27;;
        root.querySelector(&#x27;#wireframe&#x27;).innerHTML = `
          &lt;div class=&quot;wire-topbar&quot;&gt;
            &lt;span class=&quot;text-small&quot;&gt;${selectedScreen.id}&lt;/span&gt;
            &lt;span class=&quot;text-small text-muted&quot;&gt;${statusLabel[selectedScreen.status]}&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;wire-body&quot;&gt;
            &lt;div&gt;
              &lt;div class=&quot;text-small text-muted&quot;&gt;${selectedScreen.tab || &#x27;Modal / pushed detail&#x27;}&lt;/div&gt;
              &lt;h3&gt;${selectedScreen.title}&lt;/h3&gt;
            &lt;/div&gt;
            &lt;div class=&quot;wire-state&quot;&gt;
              &lt;i data-lucide=&quot;${kindIcon[selectedState.kind] || &#x27;circle&#x27;}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;
              &lt;div&gt;&lt;div class=&quot;text-small&quot;&gt;${selectedState.name}&lt;/div&gt;&lt;div&gt;${selectedState.detail}&lt;/div&gt;&lt;/div&gt;
            &lt;/div&gt;
            ${sections}
            ${actions}
          &lt;/div&gt;
          ${currentTabMarkup(selectedScreen.tab)}`;
      }

      function renderSelection() {
        root.querySelector(&#x27;#screen-meta&#x27;).innerHTML = `&lt;span class=&quot;viz-badge&quot;&gt;${selectedScreen.id}&lt;/span&gt;&lt;span&gt;${statusLabel[selectedScreen.status]}&lt;/span&gt;${selectedScreen.tab ? `&lt;span&gt;${selectedScreen.tab}&lt;/span&gt;` : &#x27;&#x27;}`;
        root.querySelector(&#x27;#screen-title&#x27;).textContent = selectedScreen.title;
        root.querySelector(&#x27;#screen-purpose&#x27;).textContent = selectedScreen.purpose;
        root.querySelector(&#x27;#screen-entry&#x27;).textContent = selectedScreen.entry;
        root.querySelector(&#x27;#screen-exits&#x27;).textContent = selectedScreen.exits;
        root.querySelector(&#x27;#screen-source&#x27;).textContent = selectedScreen.source;
        root.querySelector(&#x27;#screen-state-count&#x27;).textContent = `${selectedScreen.states.length} documented variants`;
        const list = root.querySelector(&#x27;#state-list&#x27;);
        list.innerHTML = &#x27;&#x27;;
        selectedScreen.states.forEach((state) =&gt; {
          const button = document.createElement(&#x27;button&#x27;);
          button.type = &#x27;button&#x27;;
          button.className = &#x27;btn&#x27;;
          button.setAttribute(&#x27;aria-pressed&#x27;, state === selectedState ? &#x27;true&#x27; : &#x27;false&#x27;);
          button.innerHTML = `&lt;span class=&quot;state-kind&quot;&gt;&lt;span class=&quot;state-glyph ${state.kind}&quot;&gt;&lt;/span&gt;${state.name}&lt;/span&gt;`;
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            selectedState = state;
            renderSelection();
          });
          list.appendChild(button);
        });
        root.querySelector(&#x27;#state-note&#x27;).textContent = selectedState.note || selectedState.detail;
        renderWireframe();
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      renderSummary();
      renderMap();
      renderSelection();
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
