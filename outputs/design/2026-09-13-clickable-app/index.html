function result(){const unknown=appState.result==='unknown',tie=appState.result==='tie',saved=appState.reviewSaved;return shell('Weekly steps · result','<p class="screen-date">Sample result · September 15, 2026</p><h1>'+(unknown?'Some steps<br>are missing.':tie?'A shared<br>first place.':'A week<br>well walked.')+'</h1><div class="result-board"><p>September 7–13 · Your final steps</p><div class="result-value">'+(unknown?'—':'52,310')+'</div><p>'+(unknown?'We couldn’t confirm your final total.':tie?'Equal best total · You and Maya':'Highest total · You')+'</p></div>'+(unknown?'<p class="subtext">We can’t confirm this leaderboard. Missing data alone doesn’t mean anyone lost. All simulated entries will return when the result is confirmed.</p>':'<div class="person-row"><span class="ft-monogram">M</span><span>Maya</span><strong>'+(tie?'52,310':'49,870')+' steps</strong></div><div class="person-row"><span class="ft-monogram">J</span><span>Jordan</span><strong>45,260 steps</strong></div>')+'<div class="information"><h2>'+(saved?'Your review is open.':'Time to check the result.')+'</h2><p>'+(saved?'Your example review request is saved. The simulated result is paused.':'Notice: Sep 15, 9:00 AM Central Time.<br>Ask for a review by Sep 17, 9:00 AM Central Time. The result is not final yet.')+'</p></div><details><summary>Simulated result</summary>'+(unknown?'Expected return: $20 to each person.':tie?'Expected return: $30 each to you and Maya; $0 to Jordan.':'Expected return: $60 to you; $0 to Maya and Jordan.')+' Fee $0. These are proposed simulated results, not recorded returns. No real money moves. Nothing can be paid out or redeemed.</details>'+sim,button(saved?'View your review request':'Ask us to review this result',saved?'review-receipt':'review')+button('Back to Challenges','challenges','quiet-action'))}
function review(){return shell('Review this result','<h1>Something<br>doesn’t look right?</h1><p class="gt-intro">Tell us what to check. Your request pauses the simulated result.</p><label class="gt-label" for="review-reason">What should we review?</label><select class="gt-field" id="review-reason" data-app-field="reviewReason"><option value="">Choose a reason</option>'+['Some activity is missing','The activity total looks wrong','Something else'].map(x=>'<option '+(appState.reviewReason===x?'selected':'')+'>'+x+'</option>').join('')+'</select><div class="gt-field-wrap"><label class="gt-label" for="review-note">Anything else? <span class="subtext">Optional</span></label><textarea class="gt-field" id="review-note" data-app-field="reviewNote" maxlength="1000" placeholder="For example, which day we should check.">'+esc(appState.reviewNote)+'</textarea></div><p class="subtext">Your friends won’t see your message. You don’t need to share routes or personal health details.</p><div class="information"><h2>Review by September 17</h2><p>9:00 AM Central Time · Sample deadline</p></div><p id="form-error" class="gt-error" role="alert"></p>',button('Preview review request','save-review')+button('Keep this result','back','quiet-action'))}
function reviewReceipt(){return shell('Your review request','<div class="receipt-hero"><span class="receipt-mark">'+symbol('check')+'</span><h1>We have<br>your request.</h1><p>Example receipt · Nothing was sent.<br>The simulated result is paused.</p></div><section class="letter-record"><h2>Weekly steps</h2><p>Sep 7–13</p><p><strong>'+esc(appState.reviewReason||'Some activity is missing')+'</strong></p><p>Saved in this preview<br>Sep 15, 2026 · 9:41 AM CT</p></section>'+(appState.reviewNote?'<p class="subtext">'+esc(appState.reviewNote)+'</p>':'')+'<p class="subtext">Review updates appear here and on Home. You don’t need a push notification to find them.</p>',button('Back to the result','result'))}
function health(){return shell('Apple Health','<div class="health-symbol">'+symbol('heart')+'</div><h1>Connect<br>Apple Health.</h1><p class="gt-intro">GameTime uses eligible Apple Watch activity from Apple Health for your challenge.</p><div class="information"><h2>'+(appState.health==='unconnected'?'Not connected.':'Waiting for activity.')+'</h2><p>'+(appState.health==='unconnected'?'Choose what to share before you connect. In this prototype, no activity leaves your device and no permission prompt opens.':'This is an example waiting state. Allowing access alone does not mean we can read enough activity for a challenge.')+'</p></div>'+'<details><summary>Steps &amp; exercise time</summary>We read only the activity your selected challenge needs. Exercise time is not the total duration of every workout.</details><details><summary>Running distance &amp; timed runs</summary>Distance goals add up eligible runs. Timed goals use your best eligible whole run, including pauses.</details>'+'<details><summary>What stays private?</summary>Routes, heart rate, and your other health records are not shown to friends. We use only the activity needed to score the challenge you agreed to.</details>'+row('support','Need help connecting?','Check permissions or get help','circle-help'),button(appState.health==='unconnected'?'Preview connecting Apple Health':'Show not-connected state','connect-health')+button('Back to You','you','quiet-action'))}
function privacy(){return shell('Privacy & sharing','<h1>Who sees<br>your activity.</h1><p class="gt-intro">Clear choices about who sees your activity.</p><details open><summary>In a friend challenge</summary>The people in your challenge can see its agreed activity total, your goal when there is one, and your result. They can’t see routes, heart rate, or your activity outside the challenge.</details><details><summary>Your personal goals</summary>Your activity and result stay private. This preview does not add public profiles or automatic sharing.</details><details><summary>In the community</summary>Other members don’t see your name or individual activity. Group counts only appear when there are at least five people and the update is at least 15 minutes old.</details><div class="information"><h2>Take a break.</h2><p>You can pause starting new challenges. Existing challenges continue, and you can still leave or ask for a review.</p></div><div class="toggle-row"><span>Pause new challenges<small>Preview preference only</small></span><button type="button" data-do="toggle-pause" role="switch" aria-label="Pause new challenges" aria-checked="'+appState.pause+'"><span></span></button></div>'+row('support','Blocking or reporting','Get help with another account','shield')+'<p class="subtext">No contact imports. No automatic result sharing.</p>','', 'you')}
function community(){return shell('GameTime community','<div class="health-symbol">'+symbol('users-round')+'</div><h1>One goal.<br>Your own way.</h1><p class="gt-intro">A private GameTime group. Everyone works toward the same step goal, individually.</p><div class="information"><h2>Join details aren’t ready.</h2><p>We’ll show the exact goal, dates, and simulated amount here before you decide to join.</p></div><details open><summary>Private by default</summary>Your name and individual activity stay private. Group counts only appear when at least five people have joined and the update is at least 15 minutes old.</details><p class="subtext">This screen previews the unavailable state. No group size, goal, or amount has been chosen for launch.</p>',button('Back to Challenges','challenges'))}
function support(){return shell('Help & support','<h1>Let’s get<br>it sorted.</h1><p class="gt-intro">Get help with your account, activity, or a challenge.</p>'+row('review','Review a result','Weekly steps · sample result','clipboard-check')+'<details><summary>My activity hasn’t updated</summary>Your last confirmed activity stays visible. Check Apple Health permissions and reopen GameTime. Missing activity alone does not establish a miss.</details><details><summary>I want to leave a challenge</summary>Open its details and choose Leave challenge. Before the result is final, your simulated entry returns. You do not need to give a reason.</details><div class="gt-field-wrap"><label class="gt-label" for="help-message">How can we help?</label><textarea id="help-message" class="gt-field" data-app-field="contact" maxlength="1000" placeholder="Tell us what happened.">'+esc(appState.contact)+'</textarea></div><p id="form-error" class="gt-error" role="alert"></p>'+(appState.supportSaved?'<p class="help-status" role="status">Message preview saved. Nothing was sent.</p>':''),button('Preview support message','save-support'))}
function profile(){return shell('Your profile','<h1>A name<br>your friends know.</h1><p class="gt-intro">Your username appears in your friend challenges.</p>'+field('username','Username',appState.username,'text','maxlength="24" autocomplete="off"')+'<p class="subtext">Use 3–24 letters, numbers, or underscores.</p><p id="form-error" class="gt-error" role="alert"></p><div class="information"><h2>Your profile picture</h2><p>We use your initial for your profile picture.</p></div>',button('Save preview profile','save-profile'))}

function challengeIndex(){let items='';if(detailState.filter==='active')items=(appState.withdrawn?'':leaderboardCard())+personalCard();else if(detailState.filter==='upcoming')items='<button class="ft-personal-preview" type="button" data-go="invitation"><span class="ft-card-top"><span>INVITATION FROM MAYA</span><span>Sep 16–22</span></span><h2>Next week’s kilometres</h2><p>Your own goal, with friends.<br>Review the invitation.</p></button>';else items='<button class="ft-personal-preview" type="button" data-go="result"><span class="ft-card-top"><span>SAMPLE RESULT</span><span>Sep 7–13</span></span><h2>Weekly steps</h2><span class="gt-goal-metric">52,310 <small>your steps</small></span><p>Result posted · Review available</p></button>';return mainNav()+'<main class="gt-main ft-list-main"><h1>Your<br>challenges.</h1><nav class="ft-switch ft-list-filter" aria-label="Challenge status">'+[['active','Active · '+(appState.withdrawn?'1':'2')],['upcoming','Upcoming'],['history','History']].map(([key,label])=>'<button type="button" data-filter="'+key+'" aria-pressed="'+(detailState.filter===key)+'">'+label+'</button>').join('')+'</nav>'+items+row('community','GameTime community','A private group, a shared goal','users-round')+'</main>'+tabs('challenges')}
function render(scroll=false){root.dataset.direction='fieldwork';root.dataset.screen=design.screen;root.dataset.material=design.material;root.dataset.header='green';root.style.colorScheme=design.appearance==='auto'?'light dark':design.appearance;document.getElementById('gt-phone').style.colorScheme='inherit';content.innerHTML=({create:flow,home,detail:challengeDetail,challenges:challengeIndex,you,goal:goalDetail,lobby,invitePreview,invitation,agreement,scheduled,result,review,reviewReceipt,community,health,privacy,support,profile,existing,leave,left})[design.screen]();
 if((design.screen==='create'&&draft.step===1)||design.screen==='invitePreview'){content.querySelector('.gt-intro')?.insertAdjacentHTML('afterend',artwork('strip',design.screen==='create'?'lace':'bump'))}
 if(design.screen==='create'&&draft.step===5){content.querySelector('.gt-ticket').remove();content.querySelector('.gt-summary').outerHTML=artwork('strip','lace')+draftStory();const b=content.querySelector('[data-action="edit"]');b.dataset.action='draft-continue';b.innerHTML=(draft.who==='friends'?'Continue to friend lobby':'Review complete goal rules')+symbol('arrow-right');content.querySelector('.gt-footer-note').textContent='Local preview · nothing is scheduled or sent.'}
 if(design.screen==='detail'&&detailState.tab==='rules'){content.querySelector('main').insertAdjacentHTML('beforeend',button('Leave challenge','leave','quiet-action'))}
 if(design.screen==='agreement')content.querySelector('[data-do="agree"]').disabled=!appState.consent;
 content.querySelectorAll('.gt-icon-button').forEach(el=>{if(!el.hasAttribute('aria-label'))el.setAttribute('aria-label',el.dataset.do==='back'||el.dataset.action==='back'?'Go back':el.dataset.go==='create'||el.dataset.action==='create'?'Create a challenge':'Close and go Home')});
 const picker=root.querySelector('[data-screen-picker]');picker.value=design.screen;root.querySelector('.scenario-tools').hidden=design.screen!=='result';root.querySelector('[data-result-picker]').value=appState.result;
 root.querySelector('[data-art-picker]').value=design.art;root.querySelector('[data-do="solid"]').textContent=design.material==='glass'?'Solid':'Glass';
 root.querySelector('[data-do="appearance"]').textContent=design.appearance==='dark'?'Light':'Dark';
 globalThis.lucide?.createIcons({attrs:{width:20,height:20}});
 if(scroll){document.getElementById('gt-phone').scrollIntoView({block:'start',behavior:'instant'});const h=content.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}
}
function error(message){let p=content.querySelector('#form-error');if(!p){p=document.createElement('p');p.className='gt-error';p.setAttribute('role','alert');content.querySelector('main').append(p)}p.textContent=message;p.scrollIntoView({block:'nearest'})}
function nextStep(){draft.error='';if(draft.step===3&&draft.who==='personal'&&(!draft.target.trim()||(draft.activity==='timed'?!/^\d+:[0-5]\d$/.test(draft.target)||parseInt(draft.target.replace(':',''))===0:!(Number(draft.target)>0))))draft.error=draft.activity==='timed'?'Enter a time in minutes and seconds, such as 25:00.':'Enter a target greater than zero to continue.';else if(draft.step===3&&draft.activity==='timed'&&!(Number(draft.distance)>0))draft.error='Choose a whole run distance greater than zero to continue.';else if(draft.step===4&&(!Number.isInteger(Number(draft.days))||Number(draft.days)<1||Number(draft.days)>30||draft.start<'2026-09-15'||draft.start>'2026-10-13'))draft.error='Choose a start from Sep 15 to Oct 13 and a duration of 1–30 days.';else draft.step=Math.min(5,draft.step+1);render(true)}
root.addEventListener('input',e=>{if(e.target.dataset.field){if(e.target.dataset.field==='lobbyTarget')appState.personalTarget=e.target.value;else if(e.target.dataset.field==='username'){}else draft[e.target.dataset.field]=e.target.value}if(e.target.dataset.appField)appState[e.target.dataset.appField]=e.target.value});
root.addEventListener('change',e=>{if(e.target.hasAttribute('data-art-picker')){design.art=e.target.value;render();return}if(e.target.hasAttribute('data-result-picker')){appState.result=e.target.value;render();return}if(e.target.hasAttribute('data-screen-picker')){go(e.target.value);return}if(e.target.hasAttribute('data-consent')){appState.consent=e.target.checked;content.querySelector('[data-do="agree"]').disabled=!appState.consent}if(e.target.dataset.field)draft[e.target.dataset.field]=e.target.value;if(e.target.dataset.appField)appState[e.target.dataset.appField]=e.target.value});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.member){appState.members=appState.members.includes(b.dataset.member)?appState.members.filter(n=>n!==b.dataset.member):[...appState.members,b.dataset.member];render();return}

 const a=b.dataset.do||b.dataset.action;if(!a)return;
 if(a==='appearance'){design.appearance=design.appearance==='dark'?'light':'dark';render();return}
 if(a==='solid'){design.material=design.material==='glass'?'solid':'glass';b.textContent=design.material==='glass'?'Solid':'Glass';render();return}
 if(a==='back'){back();return}if(a==='close'){go('home');return}
 if(a==='next'){nextStep();return}if(a==='edit'||a==='edit-draft'){draft.step=1;go('create');render();return}
 if(a==='draft-continue'){if(!Number.isInteger(Number(draft.amount))||Number(draft.amount)<1||Number(draft.amount)>500){error('Choose a whole-dollar simulated amount from $1 to $500.');return}appState.consent=false;appState.reviewContext='draft';appState.personalTarget={steps:'50000',exercise:'150',distance:'20',timed:'25:00'}[draft.activity];go(draft.who==='friends'?'lobby':'agreement');return}
 if(a==='lobby-review'){if(appState.members.length<1){error('Choose at least one friend before reviewing the challenge.');return}if(draft.format==='goals'&&(draft.activity==='timed'?!/^\d+:[0-5]\d$/.test(appState.personalTarget):!(Number(appState.personalTarget)>0))){error('Enter a valid target to review this challenge.');return}appState.consent=false;go('agreement');return}
 if(a==='preview-invite'){go('invitePreview');return}
 if(a==='invitation-review'){appState.reviewContext='invitation';appState.consent=false;go('agreement');return}
 if(a==='decline'){appState.invite='declined';go('home');return}
 if(a==='agree'){appState.invite=appState.reviewContext==='invitation'?'accepted':appState.invite;go('scheduled');return}
 if(a==='save-review'){if(!appState.reviewReason){error('Choose a reason so we know what to check.');return}appState.reviewSaved=true;go('reviewReceipt');return}
 if(a==='review-receipt'){go('reviewReceipt');return}
 if(a==='connect-health'){appState.health=appState.health==='unconnected'?'waiting':'unconnected';render();return}
 if(a==='toggle-pause'){appState.pause=!appState.pause;render();content.querySelector('[data-do="toggle-pause"]').focus({preventScroll:true});return}
 if(a==='save-support'){if(!appState.contact.trim()){error('Tell us what happened before previewing your message.');return}appState.supportSaved=true;render();return}
 if(a==='save-profile'){const value=content.querySelector('[data-field="username"]').value.trim();if(!/^[a-zA-Z0-9_]{3,24}$/.test(value)){error('Use 3–24 letters, numbers, or underscores for your username.');return}appState.username=value;go('you');return}
 if(a==='leave-confirm'){appState.withdrawn=true;go('left');return}
 if(a==='create'&&appState.pause){go('privacy');return}
 if(screenNames[a]){go(a);return}
});

root.querySelector('.prototype-tools').insertAdjacentHTML('afterend','<div class="art-tools"><label for="art-picker">Visual accent</label><select id="art-picker" data-art-picker><option value="photo">Club morning · photography</option><option value="graphic">Stride print · collection</option><option value="none">Original · no image</option></select></div>');
design.art='graphic';design.screen='invitation';design.appearance='light';render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>render()});tweak.addSelect(design,'screen',{label:'Explore screen',options:Object.entries(screenNames).map(([value,label])=>({label,value}))});tweak.addSelect(design,'art',{label:'Visual accent',options:[{label:'Club morning · photo',value:'photo'},{label:'Stride print · collection',value:'graphic'},{label:'Original · no image',value:'none'}]});tweak.addSelect(design,'appearance',{label:'Appearance',options:[{label:'Light',value:'light'},{label:'Dark',value:'dark'}]});tweak.addSelect(appState,'result',{label:'Result example',options:[{label:'Review open',value:'review'},{label:'Equal best totals',value:'tie'},{label:'Missing final data',value:'unknown'}]});tweak.addSelect(design,'material',{label:'Controls',options:[{label:'Glass',value:'glass'},{label:'Solid',value:'solid'}]})}
